name: fanoos-${SITE_SLUG}

services:
  app:
    build: .
    container_name: fanoos-${SITE_SLUG}-app
    restart: unless-stopped
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${SITE_SLUG}.rule=Host(`${SITE_DOMAIN}`)"
      - "traefik.http.routers.${SITE_SLUG}.entrypoints=websecure"
      - "traefik.http.routers.${SITE_SLUG}.tls.certresolver=myresolver"
      - "traefik.http.services.${SITE_SLUG}.loadbalancer.server.port=80"

networks:
  traefik-net:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik_proxy}
