name: SonarQube
# Fanoos fork: this workflow relies on SonarCloud secrets that only exist in
# the upstream repo. `if:` at the job level doesn't fully skip a reusable
# workflow invocation, so we gate the triggers themselves — the workflow can
# still be invoked manually if needed.
on:
    workflow_dispatch: {}
concurrency:
    group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
    cancel-in-progress: true
permissions: {}
jobs:
    sonarqube:
        name: 🩻 SonarQube
        if: github.repository == 'element-hq/element-web' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'merge_group'
        uses: matrix-org/matrix-js-sdk/.github/workflows/sonarcloud.yml@develop # zizmor: ignore[unpinned-uses]
        permissions:
            actions: read
            statuses: write
            id-token: write # sonar
        secrets:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            ELEMENT_BOT_TOKEN: ${{ secrets.ELEMENT_BOT_TOKEN }}
        with:
            sharded: true
