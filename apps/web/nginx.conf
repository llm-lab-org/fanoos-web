server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Deploy-cache correctness ──────────────────────────────────────────────
    # Hashed assets under /bundles, /fonts, /icons, /vector-icons, and hashed
    # /i18n/*.json change URL on every deploy — cache them forever. Fixed-URL
    # files that change per deploy (index.html, config.json, version,
    # languages.json, sw.js, manifest.json) must revalidate; without that,
    # cached tabs after a deploy fetch an old index.html that references
    # bundle hashes no longer on disk, hit the SPA fallback below, and get
    # index.html served in place of CSS/JS/JSON — which silently breaks
    # translations, fonts, and occasionally the whole app. For the hashed
    # locations we also disable SPA fallback so a stale reference gets a
    # visible 404 instead of HTML-parsed-as-CSS.

    location /bundles/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location /icons/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location /vector-icons/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location = /i18n/languages.json {
        add_header Cache-Control "no-cache" always;
    }
    location ~ ^/i18n/.+\.json$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location = /config.json {
        add_header Cache-Control "no-cache" always;
    }
    location = /version {
        add_header Cache-Control "no-cache" always;
    }
    # Service worker must revalidate every load — a stale SW would keep
    # intercepting media requests indefinitely.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback — every non-file route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy the sentiment/emotion API through same-origin so the browser is not
    # blocked by CORS. See apps/web/src/fanoos/sentimentEmotion.ts.
    location /hadith-api/ {
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        proxy_pass https://api.hadith.ai/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.hadith.ai;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Sentiment inference on a large batch can take a while; give the upstream
        # room before we time it out. The client also has its own 45s AbortController.
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

}
