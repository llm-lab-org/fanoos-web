server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — every non-file route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy the sentiment/emotion API through same-origin so the browser is not
    # blocked by CORS. See apps/web/src/fanoos/sentimentEmotion.ts.
    location /hadith-api/ {
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        proxy_pass https://api.hadith.ai/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.hadith.ai;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Sentiment inference on a large batch can take a while; give the upstream
        # room before we time it out. The client also has its own 45s AbortController.
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
